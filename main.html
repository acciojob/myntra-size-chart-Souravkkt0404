<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Size Chart</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    table {
      border-collapse: collapse;
      width: 650px;
      text-align: center;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 14px 18px;
    }

    thead th {
      background: #f5f5f5;
      font-weight: bold;
    }

    tbody tr:nth-child(even) {
      background: #fafafa;
    }
  </style>
</head>

<body>

  <table>
    <thead>
      <tr>
        <th>Size</th>
        <th>To Fit Bust</th>
        <th>To Fit Waist</th>
        <th>To Fit Hip</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>XS</td>
        <td>32</td>
        <td>26</td>
        <td>34</td>
      </tr>
      <tr>
        <td>S</td>
        <td>34</td>
        <td>28</td>
        <td>36</td>
      </tr>
      <tr>
        <td>M</td>
        <td>36</td>
        <td>30</td>
        <td>38</td>
      </tr>
      <tr>
        <td>L</td>
        <td>38</td>
        <td>32</td>
        <td>40</td>
      </tr>
      <tr>
        <td>XL</td>
        <td>40</td>
        <td>34</td>
        <td>42</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
